name: Pull Request Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  swift-unit-tests:
    name: ${{ matrix.name }}
    # Only request a VM for events the MacBook controller admits automatically.
    # Fork PRs use GitHub's contributor approval and then run on hosted macOS.
    strategy:
      matrix:
        include:
          - name: Swift Unit Tests
            runner: >-
              ${{ vars.MACBOOK_CI == 'enabled' &&
                  github.actor_id == '959778' && github.triggering_actor == 'gh123man' &&
                  ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
                   (github.event_name == 'pull_request' &&
                    (github.event.action == 'opened' || github.event.action == 'synchronize') &&
                    github.event.pull_request.user.id == 959778 &&
                    github.event.pull_request.head.repo.id == github.event.repository.id)) &&
                  format('macbook-{0}-{1}', github.run_id, github.run_attempt) || 'macos-26' }}
    environment: ${{ matrix.runner == 'macos-26' && 'github-hosted-ci' || 'macbook-ci-owner' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodegen --version

      - name: Run Swift format
        run: ./OpenSnek/scripts/check_swift_format.sh

      - name: Run SwiftLint
        run: swift package --package-path OpenSnek plugin --allow-writing-to-package-directory swiftlint

      - name: Validate generated Xcode project
        run: ./OpenSnek/scripts/generate_xcodeproj.sh

      - name: Run developer tooling tests
        run: python3 -m unittest discover -s OpenSnek/scripts/tests

      - name: Run Swift package tests
        env:
          OPEN_SNEK_HW: "0"
        run: ./OpenSnek/scripts/checked_command.sh swift test --package-path OpenSnek

      - name: Validate device evidence manifest
        run: ./OpenSnek/scripts/check_device_validation.sh
